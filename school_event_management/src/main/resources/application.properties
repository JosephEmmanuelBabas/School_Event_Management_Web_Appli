spring.application.name=school_event_management

# Runtime connection: the limited user (password comes from the local profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/grp02_event_management_db?currentSchema=school_event_management_db
spring.datasource.username=event_app

# Migrations: the schema owner (password comes from the local profile)
spring.flyway.user=event_owner
spring.flyway.schemas=school_event_management_db
spring.flyway.locations=classpath:db/migration

# Hibernate may never modify the schema; Flyway is the only thing that does.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=school_event_management_db
spring.jpa.open-in-view=false

# Load src/main/resources/application-local.properties (secrets, not in Git)
spring.profiles.active=local

# Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax